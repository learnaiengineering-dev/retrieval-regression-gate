name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Widget matches the Python implementation
        run: node --test tests/js/parity.test.mjs
      - name: Gate fails on the bundled example (exit code 1)
        run: |
          set +e
          retrieval-gate examples/baseline.json examples/candidate.json examples/judgments.json --k 3
          code=$?
          test "$code" -eq 1
      - name: Build distributions
        run: python -m build

